name: Surge PR Preview

on:
  pull_request:
    paths:
      - 'site/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsconfig.site.json'
      - '.github/workflows/check-site.yml'
      - '.github/workflows/surge-preview.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: surge-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/check-site.yml

  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: surge-preview
      url: https://${{ steps.preview.outputs.preview_url }}/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      - uses: afc163/surge-preview@v1
        id: preview
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dist: site/dist
          build: test -f site/dist/index.html
          failOnError: 'true'
