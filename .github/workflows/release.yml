name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/;
          const match = semver.exec(version);
          if (!match || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must equal v + package.json version (for example v0.1.0 or v0.2.0-beta.1).');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${Boolean(match[4])}\n`);
          NODE

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            arch: arm64
          - os: windows-latest
            platform: Windows
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const key of ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_API_KEY_BASE64', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER']) {
            if (!process.env[key]?.trim()) throw new Error(`Missing release credential: ${key}`);
          }
          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64').toString('utf8');
          if (!key.includes('-----BEGIN PRIVATE KEY-----')) throw new Error('APPLE_API_KEY must contain a Base64-encoded .p8 private key.');
          writeFileSync(join(process.env.RUNNER_TEMP, 'AuthKey.p8'), key, { mode: 0o600 });
          NODE

      - name: Verify runner architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.TARGET_ARCH) throw new Error('Use a runner matching the target architecture');"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Electron binary
        run: pnpm electron:install

      - name: Check types
        run: pnpm tsc

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm run package --mac --arm64 --config.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Sive.app
          spctl --assess --type execute --verbose=4 release/mac-arm64/Sive.app
          xcrun stapler validate release/mac-arm64/Sive.app

      - name: Package Windows
        if: runner.os == 'Windows'
        run: pnpm run package --win --x64

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Sive-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Remove notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Sive-*
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*-Setup.exe
